<!DOCTYPE html>

<head>

<link rel="stylesheet" href="assets/site.css">
<script>/* Kayıtlı tema tercihini boyamadan önce uygula (FOUC yok).
   Aynı yerde .yazi-yazim sınıfı eklenir: başlık, daktilo animasyonu hazırlanana
   kadar gizli kalsın diye. JS kapalıysa sınıf hiç eklenmez, başlık normal görünür. */
(function(){try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}
document.documentElement.classList.add("yazi-yazim");})();</script>
<!-- yazi:bas -->
<link rel="stylesheet" href="assets/fonts.css">
<link rel="canonical" href="https://sdfkr22.github.io/ai-handbook/">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf7ec">

<script>(function(){if(!("serviceWorker" in navigator))return;if(location.protocol!=="http:"&&location.protocol!=="https:")return;window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});});})();</script>

</head>
<body>
<button class="tema-btn" id="temaBtn" type="button" aria-label="Temayı değiştir" title="Temayı değiştir"></button>
<div class="wrap">

  <header class="hero">
    <p class="kicker">AI Handbook</p>
    <h1>Claude Code<br><em>in practice</em></h1>
    <p class="lede">Dokümantasyon sayfaları, blog yazıları ve makalelerden derlenmiş; kritik detayları atlamayan tek sayfalık yazılar. Konu başlığına göre filtrele veya ara.</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Başlık, açıklama veya etikette ara…" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <select class="sirala" id="sirala" aria-label="Sıralama">
        <option value="yeni">Yeni → Eski</option>
        <option value="eski">Eski → Yeni</option>
        <option value="kisa">Kısa → Uzun</option>
        <option value="uzun">Uzun → Kısa</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <span id="updated"></span>
  </footer>

</div>

<script src="data/posts.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
